[project]
name = "llm-sketchpad"
version = "0.1.0"
description = "Collection of self-contained Jupyter Notebooks on training LLMs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ipykernel==7.1.0",
  "numpy==2.3.4",
  "torch==2.9.0",
  "matplotlib==3.10.7",
  "transformers==4.57.3",
  "ipywidgets==8.1.8",
  "tiktoken==0.12.0",
  "datasets==4.4.2",
]

# Don't allow non-wheel installs (no compile from source, affect uv, uv pip)
[tool.uv]
no-build = true
